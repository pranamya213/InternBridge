{% extends "base.html" %}

{% block title %}Login | InternBridge{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to continue to InternBridge</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                    <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';">
                        👁️
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">Login</button>
        </form>
        <div class="auth-footer text-center mt-4">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
        </div>
    </div>
</section>
{% endblock %}
